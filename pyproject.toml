[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-transformer-california-housing"
version = "1.0.0"
description = "A from-scratch PyTorch FT-Transformer for tabular regression, benchmarked against classical baselines on the California Housing dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ayush Kumar Singh", email = "ab49ayush@gmail.com" },
    { name = "Garima Srivastava", email = "gsrivastava1@lko.amity.edu" },
]
keywords = [
    "deep-learning", "transformers", "tabular-data", "pytorch",
    "feature-tokenizer", "self-attention", "regression",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "optuna>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
]

[project.urls]
Repository = "https://github.com/Ayush-2703/ft-transformer-california-housing"
Paper = "https://github.com/Ayush-2703/ft-transformer-california-housing/blob/main/docs/paper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q -m 'not network'"
markers = [
    "network: test requires network access (e.g. dataset download)",
    "slow: test is slow (full-length training)",
]

[tool.coverage.run]
source = ["src/ft_transformer"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length handled by black
    "C408",  # dict(...) calls are used intentionally for readability/fidelity to the source notebook
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
