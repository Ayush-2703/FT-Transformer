name: Bug report
description: Something in the pipeline isn't working as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command / config used
      placeholder: "python scripts/train.py --d-token 64 ..."
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Python version, OS, and `pip freeze | grep -E "torch|optuna|scikit-learn"`
    validations:
      required: true
